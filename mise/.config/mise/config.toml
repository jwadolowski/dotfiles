[tools]
# Required by groovyls (managed via Mason in nvim)
java = ["temurin-25"]
node = ["lts"]
ruby = ["3"]
python = ["3", "3.8"]
neovim = ["0.12"]

[settings]
trusted_config_paths = ["~/projects"]
idiomatic_version_file_enable_tools = ["node"]

[env]
# https://github.com/jdx/mise/discussions/5119
_.file = '.env'        # Required to load .env file in new terminal tabs
MISE_ENV_FILE = ".env" # Automatically load .env file contents on directory change

# 1Password SSH agent socket
#
# Ref: https://developer.1password.com/docs/ssh/get-started/
SSH_AUTH_SOCK = '{{env.HOME}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock'
