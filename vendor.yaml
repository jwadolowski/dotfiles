# Upstream content vendored into this repo.
#
# Renovate bumps 'ref' (tagged upstreams) or 'pin' (branch upstreams) via the
# custom managers in renovate.json; .github/workflows/vendor.yaml then runs
# scripts/vendor.sh to materialize the files on the same branch.
#
# Field order matters - the Renovate regexes match 'repo/track/ref/pin' adjacent.
targets:
  - name: terraform-skill
    repo: antonbabenko/terraform-skill
    track: tag
    ref: v1.17.1
    pin: b59d2be9ff4db8f835c8459e05e325ba11e3a21f
    copy:
      - from: skills/terraform-skill
        to: opencode/.config/opencode/skills/terraform-skill
  - name: brave-search-skills
    repo: brave/brave-search-skills
    track: branch
    ref: main
    pin: 62793e0c49ed2fc7c8f0c99a8ab8898abdf32a1d
    copy:
      - from: skills
        to: opencode/.config/opencode/skills
  # Only the cavecrew agent definitions are vendored from caveman. The commands,
  # the opencode plugin and the caveman skills are installer output that diverges
  # from upstream by design, so they stay tracked as ordinary repo content.
  #
  # Upstream writes these for Claude Code; 'patch' applies the same frontmatter
  # sanitising the caveman installer does, so the result is opencode-loadable.
  - name: caveman-agents
    repo: JuliusBrussee/caveman
    track: tag
    ref: v2.5.0
    pin: f9a039a93d249f3fcdb47a9e02544cd1ce37ba4a
    copy:
      - from: agents
        to: opencode/.config/opencode/agents
        include: ["cavecrew-*.md"]
        patch: strip-claude-frontmatter
      # The always-on ruleset. opencode.jsonc references it through
      # "instructions", so AGENTS.md stays hand-written and unfenced.
      - from: src/rules/caveman-activate.md
        to: opencode/.config/opencode/rules/caveman.md
      # Upstream keeps an opencode-specific command set; take it wholesale.
      - from: src/plugins/opencode/commands
        to: opencode/.config/opencode/commands
      # The skill dirs the caveman installer selects for opencode
      # (OPENCODE_SKILL_DIRS in bin/install.js); the repo-level skills/ holds
      # build tooling and other harnesses' skills alongside them.
      - from: skills
        to: opencode/.config/opencode/skills
        include:
          - caveman
          - caveman-commit
          - caveman-review
          - caveman-help
          - caveman-stats
          - caveman-compress
          - cavecrew
